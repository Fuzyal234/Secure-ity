apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-ity-flask
  namespace: secure-ity
  labels:
    app: secure-ity-flask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-ity-flask
  template:
    metadata:
      labels:
        app: secure-ity-flask
    spec:
      containers:
      - name: flask-app
        image: secure-ity-flask:latest
        # For production, use specific tag:
        # image: secure-ity-flask:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: PYTHONPATH
          value: "/app"
        - name: ENV
          valueFrom:
            configMapKeyRef:
              name: secure-ity-config
              key: ENV
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: secure-ity-config
              key: LOG_LEVEL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: secure-ity-config
              key: REDIS_URL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: secure-ity-secrets
              key: SECRET_KEY
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: secure-ity-secrets
              key: JWT_SECRET_KEY
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: secure-ity-secrets
              key: ENCRYPTION_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: secure-ity-secrets
              key: DATABASE_URL
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secure-ity-secrets
              key: REDIS_PASSWORD
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: secure-ity-config
              key: CORS_ORIGINS
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: logs
        emptyDir: {}
      # For production, use persistent volume for logs:
      # - name: logs
      #   persistentVolumeClaim:
      #     claimName: logs-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: secure-ity-flask
  namespace: secure-ity
  labels:
    app: secure-ity-flask
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: secure-ity-flask

