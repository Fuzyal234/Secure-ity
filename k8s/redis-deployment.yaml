apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-ity-redis
  namespace: secure-ity
  labels:
    app: secure-ity-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-ity-redis
  template:
    metadata:
      labels:
        app: secure-ity-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command:
          - redis-server
          - --requirepass
          - $(REDIS_PASSWORD)
          - --appendonly
          - "yes"
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secure-ity-secrets
              key: REDIS_PASSWORD
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: redis-data
        emptyDir: {}
      # For production, use persistent volume:
      # - name: redis-data
      #   persistentVolumeClaim:
      #     claimName: redis-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: secure-ity-redis
  namespace: secure-ity
  labels:
    app: secure-ity-redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: secure-ity-redis

